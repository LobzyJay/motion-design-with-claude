        - heading "I developed the brand identity for Gray Matter, a neuroscience company focused on predictive neurocare that uses advanced brain signal analysis to detect changes in brain health before symptoms appear, enabling earlier and smarter intervention. The logo combines the form of a brain with the letter G, creating a bold, structured mark that reflects clarity and intelligence. The graphics are influenced by the brain’s structure, mathematical mapping, and the natural flow of gray matter. Built with nodes, they are procedurally generated to provide flexibility and depth, featuring glass-like textures, soft motion lines, and abstract numerical forms. The UI is minimal and modern, with bold typography, clean layouts, and subtle motion that reinforce trust and precision. Despite the name, the brand avoids gray, using vibrant, data-inspired colors that convey cognition, energy, and motion." [level=6] [ref=e231]:
