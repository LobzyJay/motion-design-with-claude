        - paragraph [ref=e125]:
          - generic [ref=e126]: FORM is an AI-powered creative system that turns unstructured inputs into clarity.
          - generic [ref=e127]: Its identity embodies the duality of human and machine, one smooth and organic, the other pixelated and digital. The dual-eye logo captures this vision, symbolizing creativity and computation merging into one.
          - generic [ref=e128]: Graphics are built from people, artworks, avatars, and fragments recomposed into immersive compositions. Pixels scatter and reform, merging precision with artistic flow. Icons function as abstract glyphs, inspired by ancient symbols yet reframed as pixel modules representing different parameters of FORM's identity.
          - generic [ref=e129]: Layouts follow abstract grids with a clean editorial touch, balancing artistic expression with technological clarity. Imagery is reframed through frames and pixelation, bold in color and expressive in tone, reinforcing FORM's cultural and computational duality.
          - text: The result is a living, adaptive identity, an instrument that reframes culture into clarity.
