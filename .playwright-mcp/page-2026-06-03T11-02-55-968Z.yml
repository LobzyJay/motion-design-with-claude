        - paragraph [ref=e104]:
          - generic [ref=e105]: Radial is an AI startup building an orchestration platform for health and life sciences. The challenge was positioning a deeply technical product within a human, biological context without losing precision or credibility.
          - generic [ref=e106]: The concept came from the logo, a radial mark of eight stems reading simultaneously as a neuron, a flower, and a system diagram. Seven signals follow the pattern. One finds what the others missed. That single line became the foundation for everything.
          - generic [ref=e107]: Graphics are botanical structures annotated with machine vision data, sitting between scientific illustration and AI inference. The palette is pulled from nature. The UI follows Swiss editorial logic, structured and typographic through a dark terminal environment. Animation balances biological calm with live data underneath.
          - text: The result is a brand that feels grown as much as designed. Precise where it needs to be. Organic where it matters.
